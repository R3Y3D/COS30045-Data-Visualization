<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="500" fill="#8ecae6" />

  <!-- Grass / Ground -->
  <rect x="0" y="500" width="800" height="300" fill="#008000" />

  <!-- Sun -->
  <circle cx="660" cy="160" r="65" fill="#ffee00" />

  <!-- Tree Trunk -->
  <rect x="125" y="420" width="35" height="150" fill="#a0522d" />

  <!-- Tree Foliage (overlapping circles for heart/cloud shape) -->
  <circle cx="115" cy="400" r="45" fill="#228b22" />
  <circle cx="170" cy="400" r="45" fill="#228b22" />
  <circle cx="142" cy="430" r="45" fill="#228b22" />

  <!-- House Body -->
  <rect x="240" y="325" width="320" height="245" fill="#8c4b18" />

  <!-- House Roof -->
  <polygon points="400,165 240,325 560,325" fill="#c47833" />

  <!-- Windows -->
  <rect x="272" y="360" width="65" height="65" fill="#b0d8ea" />
  <rect x="463" y="360" width="65" height="65" fill="#b0d8ea" />

  <!-- Door -->
  <rect x="368" y="440" width="65" height="130" fill="#9e4b2d" />

  <!-- Doorknob -->
  <circle cx="415" cy="505" r="8" fill="#000000" />

  <!-- Curved Path to House -->
  <path d="M 450,810 Q 200,690 400,580" fill="none" stroke="#ffa500" stroke-width="8" />
  <path d="M 390,810 Q 160,690 360,580" fill="none" stroke="#ffa500" stroke-width="8" />

  <!-- Text Label -->
  <text x="610" y="475" font-family="sans-serif" font-size="40" fill="#000000">House</text>
</svg>
